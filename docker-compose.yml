# BuildShield completo con Docker: 8 PostgreSQL 16 (una base por microservicio, como en la arquitectura v4),
# Kafka en modo KRaft, los 8 microservicios, el API Gateway y la web.
#
# Requisitos: Docker Compose v2.17 o superior (usa additional_contexts) y los repositorios buildshield-*
# clonados como hermanos de este (../buildshield-iam-service, ../buildshield-api-gateway, ...).
# Las claves JWT llegan desde .env (ver .env.example).
#
#   docker compose up -d --build                         # todo
#   docker compose up -d --build api-gateway iam-service organization-service   # solo lo que ya existe
#
# Web: http://localhost:4200 · Gateway: http://localhost:8080 · Swagger: http://localhost:8080/swagger-ui.html
# Kafka desde el host: localhost:9094.
#
# Decisión: una instancia de PostgreSQL por servicio (no una sola con script de inicio) para que el
# despliegue local refleje "una base por microservicio" y ningún servicio pueda ver la base de otro.

name: buildshield

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20

x-service: &service
  restart: unless-stopped
  depends_on: &service-depends
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 3s
    retries: 30
    start_period: 30s

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: local
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  BUILDSHIELD_JWT_PUBLIC_KEY: ${BUILDSHIELD_JWT_PUBLIC_KEY:?Falta BUILDSHIELD_JWT_PUBLIC_KEY en .env}

services:
  # ---------------------------------------------------------------- bases (una por microservicio)
  iam-db:
    <<: *postgres
    environment: { POSTGRES_DB: iam_db, POSTGRES_USER: iam_service, POSTGRES_PASSWORD: iam_service }
    volumes: [iam-db-data:/var/lib/postgresql/data]
  organization-db:
    <<: *postgres
    environment: { POSTGRES_DB: organization_db, POSTGRES_USER: organization_service, POSTGRES_PASSWORD: organization_service }
    volumes: [organization-db-data:/var/lib/postgresql/data]
  inventory-db:
    <<: *postgres
    environment: { POSTGRES_DB: inventory_db, POSTGRES_USER: inventory_service, POSTGRES_PASSWORD: inventory_service }
    volumes: [inventory-db-data:/var/lib/postgresql/data]
  ordering-db:
    <<: *postgres
    environment: { POSTGRES_DB: ordering_db, POSTGRES_USER: ordering_service, POSTGRES_PASSWORD: ordering_service }
    volumes: [ordering-db-data:/var/lib/postgresql/data]
  discrepancy-db:
    <<: *postgres
    environment: { POSTGRES_DB: discrepancy_db, POSTGRES_USER: discrepancy_service, POSTGRES_PASSWORD: discrepancy_service }
    volumes: [discrepancy-db-data:/var/lib/postgresql/data]
  subscription-db:
    <<: *postgres
    environment: { POSTGRES_DB: subscription_db, POSTGRES_USER: subscription_service, POSTGRES_PASSWORD: subscription_service }
    volumes: [subscription-db-data:/var/lib/postgresql/data]
  notification-db:
    <<: *postgres
    environment: { POSTGRES_DB: notification_db, POSTGRES_USER: notification_service, POSTGRES_PASSWORD: notification_service }
    volumes: [notification-db-data:/var/lib/postgresql/data]
  audit-db:
    <<: *postgres
    environment: { POSTGRES_DB: audit_db, POSTGRES_USER: audit_service, POSTGRES_PASSWORD: audit_service }
    volumes: [audit-db-data:/var/lib/postgresql/data]

  # ---------------------------------------------------------------- Kafka KRaft (un nodo)
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Crea los 6 tópicos del plan (sección 5) con 3 particiones, igual que dev-kafka.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in iam organization inventory ordering discrepancy subscription; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic buildshield.$$t --partitions 3 --replication-factor 1
        done
    restart: "no"

  # ---------------------------------------------------------------- microservicios
  iam-service:
    <<: *service
    build: ../buildshield-iam-service
    depends_on:
      <<: *service-depends
      iam-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      DB_HOST: iam-db
      DB_NAME: iam_db
      DB_USER: iam_service
      DB_PASSWORD: iam_service
      BUILDSHIELD_JWT_PRIVATE_KEY: ${BUILDSHIELD_JWT_PRIVATE_KEY:?Falta BUILDSHIELD_JWT_PRIVATE_KEY en .env}
  organization-service:
    <<: *service
    build: ../buildshield-organization-service
    depends_on:
      <<: *service-depends
      organization-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      DB_HOST: organization-db
      DB_NAME: organization_db
      DB_USER: organization_service
      DB_PASSWORD: organization_service
  inventory-service:
    <<: *service
    build: ../buildshield-inventory-service
    depends_on:
      <<: *service-depends
      inventory-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      DB_HOST: inventory-db
      DB_NAME: inventory_db
      DB_USER: inventory_service
      DB_PASSWORD: inventory_service
  ordering-service:
    <<: *service
    build: ../buildshield-ordering-service
    depends_on:
      <<: *service-depends
      ordering-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      DB_HOST: ordering-db
      DB_NAME: ordering_db
      DB_USER: ordering_service
      DB_PASSWORD: ordering_service
  discrepancy-service:
    <<: *service
    build: ../buildshield-discrepancy-service
    depends_on:
      <<: *service-depends
      discrepancy-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8085"
      DB_HOST: discrepancy-db
      DB_NAME: discrepancy_db
      DB_USER: discrepancy_service
      DB_PASSWORD: discrepancy_service
  subscription-service:
    <<: *service
    build: ../buildshield-subscription-service
    depends_on:
      <<: *service-depends
      subscription-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8086"
      DB_HOST: subscription-db
      DB_NAME: subscription_db
      DB_USER: subscription_service
      DB_PASSWORD: subscription_service
  notification-service:
    <<: *service
    build: ../buildshield-notification-service
    depends_on:
      <<: *service-depends
      notification-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8087"
      DB_HOST: notification-db
      DB_NAME: notification_db
      DB_USER: notification_service
      DB_PASSWORD: notification_service
  audit-service:
    <<: *service
    build: ../buildshield-audit-service
    depends_on:
      <<: *service-depends
      audit-db: { condition: service_healthy }
    environment:
      <<: *service-env
      SERVER_PORT: "8088"
      DB_HOST: audit-db
      DB_NAME: audit_db
      DB_USER: audit_service
      DB_PASSWORD: audit_service

  # ---------------------------------------------------------------- entrada
  api-gateway:
    build: ../buildshield-api-gateway
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      BUILDSHIELD_JWT_PUBLIC_KEY: ${BUILDSHIELD_JWT_PUBLIC_KEY:?Falta BUILDSHIELD_JWT_PUBLIC_KEY en .env}
      BUILDSHIELD_CORS_ALLOWED_ORIGINS: http://localhost:4200
      IAM_URI: http://iam-service:8081
      ORGANIZATION_URI: http://organization-service:8082
      INVENTORY_URI: http://inventory-service:8083
      ORDERING_URI: http://ordering-service:8084
      DISCREPANCY_URI: http://discrepancy-service:8085
      SUBSCRIPTION_URI: http://subscription-service:8086
      NOTIFICATION_URI: http://notification-service:8087
      AUDIT_URI: http://audit-service:8088
    # El gateway no espera a los servicios: arranca solo y responde 5xx en la ruta del que no esté arriba.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: ../buildshield-web
      dockerfile: ../buildshield-platform/docker/web/Dockerfile
      additional_contexts:
        platform: ./docker/web
    restart: unless-stopped
    ports: ["4200:80"]
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  iam-db-data:
  organization-db-data:
  inventory-db-data:
  ordering-db-data:
  discrepancy-db-data:
  subscription-db-data:
  notification-db-data:
  audit-db-data:
